# =============================================================================
# SDSe - Automated Tests
# =============================================================================
# Runs engine tests automatically on every push.
# Results visible in the GitHub Actions tab.
#
# Two stages:
#   1. Check Python syntax (fast, catches paste corruption).
#   2. Run engine tests (membrane, form-finding, benchmark).
#
# Updated 2026-09-27:
#   - Added a compile check. Any file with a syntax error fails
#     the CI immediately.
#   - Install dependencies from requirements.txt instead of
#     numpy alone.
# =============================================================================

name: Engine Tests

on:
  push:
    branches:
      - main
      - modular-v10
  pull_request:
    branches:
      - main
      - modular-v10
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Check Python syntax
        run: |
          python -m compileall -q ui/ engine/ core/ data/ app.py run_tests.py benchmark_hypar.py

      - name: Run engine tests
        run: |
          python run_tests.py
