<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8" />
<title>Dome Cone Picker</title>
<style>
  html, body {
    margin: 0;
    padding: 0;
    background: transparent;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI",
                 Roboto, sans-serif;
    color: #a8b8c8;
  }
  #wrap {
    width: 100%;
    box-sizing: border-box;
    padding: 8px 0 4px 0;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  #svg-container {
    width: 440px;
    max-width: 100%;
    aspect-ratio: 1 / 1;
  }
  svg {
    display: block;
    width: 100%;
    height: 100%;
    background: transparent;
    touch-action: manipulation;
    user-select: none;
    -webkit-user-select: none;
  }
  .ground-circle {
    fill: none;
    stroke: #2ecc71;
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
  }
  .frame-line-a {
    stroke: #FF6B6B;
    stroke-width: 1;
    stroke-dasharray: 3 3;
    opacity: 0.45;
    vector-effect: non-scaling-stroke;
  }
  .frame-line-b {
    stroke: #e07b39;
    stroke-width: 1;
    stroke-dasharray: 3 3;
    opacity: 0.45;
    vector-effect: non-scaling-stroke;
  }
  .pick {
    cursor: pointer;
    transition: fill 0.12s ease;
  }
  .pick.off {
    fill: #3a4a5a;
    stroke: #556677;
    stroke-width: 1;
    vector-effect: non-scaling-stroke;
  }
  .pick.on {
    fill: #f1c40f;
    stroke: #fff3b0;
    stroke-width: 2;
    vector-effect: non-scaling-stroke;
  }
  /* Slight colour variation between crossings and midpoints
     so the user can see them at a glance when inactive. */
  .pick.crossing.off {
    fill: #3a4a5a;
  }
  .pick.midpoint.off {
    fill: #2a3a4a;
  }
  .pick.crossing.on {
    fill: #f1c40f;
  }
  .pick.midpoint.on {
    fill: #e6a800;
    stroke: #ffd980;
  }
  #caption {
    padding: 8px 0 0 0;
    font-size: 13px;
    color: #a8b8c8;
    text-align: center;
    width: 100%;
  }
  #caption b {
    color: #f1c40f;
  }
  #legend {
    padding: 6px 0 0 0;
    font-size: 11px;
    color: #7a8a9a;
    text-align: center;
    width: 100%;
  }
  #legend span {
    display: inline-block;
    margin: 0 8px;
  }
  #legend .sw {
    display: inline-block;
    width: 10px; height: 10px;
    margin-right: 4px;
    vertical-align: middle;
  }
  #legend .sw-circle {
    border-radius: 50%;
    background: #3a4a5a;
    border: 1px solid #556677;
  }
  #legend .sw-diamond {
    background: #2a3a4a;
    border: 1px solid #4a5a6a;
    transform: rotate(45deg);
  }
</style>
</head>
<body>
<div id="wrap">
  <div id="svg-container"></div>
  <div id="caption"></div>
  <div id="legend">
    <span><span class="sw sw-circle"></span>Crossing</span>
    <span><span class="sw sw-diamond"></span>Midpoint</span>
  </div>
</div>

<script>
// =============================================================================
// Streamlit component protocol (inline client)
// =============================================================================

var Streamlit = (function () {
  var RENDER_EVENT = "streamlit:render";
  var SET_FRAME_HEIGHT = "streamlit:setFrameHeight";
  var SET_COMPONENT_VALUE = "streamlit:setComponentValue";
  var SET_COMPONENT_READY = "streamlit:componentReady";
  var listeners = [];

  function sendMessage(type, data) {
    var msg = { isStreamlitMessage: true, type: type };
    if (data) { for (var k in data) { msg[k] = data[k]; } }
    window.parent.postMessage(msg, "*");
  }

  window.addEventListener("message", function (event) {
    if (!event.data || event.data.type !== RENDER_EVENT) { return; }
    listeners.forEach(function (fn) { fn(event.data.args || {}); });
  });

  return {
    setComponentReady: function () {
      sendMessage(SET_COMPONENT_READY, { apiVersion: 1 });
    },
    setFrameHeight: function (height) {
      sendMessage(SET_FRAME_HEIGHT, { height: height });
    },
    setComponentValue: function (value) {
      sendMessage(SET_COMPONENT_VALUE, { value: value, dataType: "json" });
    },
    onRender: function (fn) { listeners.push(fn); }
  };
})();

// =============================================================================
// State
// =============================================================================

var state = {
  dome_diameter: 18.0,
  n_x: 5,
  n_y: 5,
  picked: {},        // keyed by "KIND_i_j"
  positions: []      // [{kind, i, j, x, y}]
};

// =============================================================================
// Geometry
// =============================================================================

function offsets(n, R) {
  if (n < 1) n = 1;
  if (n === 1) return [0.0];
  var half = R * (n - 1) / n;
  var out = [];
  for (var k = 0; k < n; k++) {
    out.push(-half + (2 * half) * k / (n - 1));
  }
  return out;
}

function buildPositions() {
  var R = state.dome_diameter / 2.0;
  var ox = offsets(state.n_x, R);
  var oy = offsets(state.n_y, R);

  var positions = [];
  var exists = {};  // "i_j" -> true for crossings inside circle

  // ---- Crossings -----------------------------------------------------
  for (var i = 0; i < state.n_x; i++) {
    for (var j = 0; j < state.n_y; j++) {
      var xi = ox[i], yj = oy[j];
      if (xi * xi + yj * yj <= R * R + 1e-9) {
        positions.push({ kind: "C", i: i, j: j, x: xi, y: yj });
        exists[i + "_" + j] = true;
      }
    }
  }

  // ---- Family A midpoints --------------------------------------------
  // On frame i (A), between crossings (i, j) and (i, j+1).
  // Plan position: (ox[i], (oy[j] + oy[j+1]) / 2).
  for (var ia = 0; ia < state.n_x; ia++) {
    for (var ja = 0; ja < state.n_y - 1; ja++) {
      if (!exists[ia + "_" + ja]) continue;
      if (!exists[ia + "_" + (ja + 1)]) continue;
      var xa = ox[ia];
      var ya = 0.5 * (oy[ja] + oy[ja + 1]);
      // Enforce inside circle, to be safe.
      if (xa * xa + ya * ya > R * R + 1e-9) continue;
      positions.push({ kind: "Am", i: ia, j: ja, x: xa, y: ya });
    }
  }

  // ---- Family B midpoints --------------------------------------------
  // On frame j (B), between crossings (i, j) and (i+1, j).
  // Plan position: ((ox[i] + ox[i+1]) / 2, oy[j]).
  for (var ib = 0; ib < state.n_x - 1; ib++) {
    for (var jb = 0; jb < state.n_y; jb++) {
      if (!exists[ib + "_" + jb]) continue;
      if (!exists[(ib + 1) + "_" + jb]) continue;
      var xb = 0.5 * (ox[ib] + ox[ib + 1]);
      var yb = oy[jb];
      if (xb * xb + yb * yb > R * R + 1e-9) continue;
      positions.push({ kind: "Bm", i: ib, j: jb, x: xb, y: yb });
    }
  }

  state.positions = positions;
}

// =============================================================================
// SVG helpers
// =============================================================================

var SVG_NS = "http://www.w3.org/2000/svg";

function el(tag, attrs) {
  var e = document.createElementNS(SVG_NS, tag);
  for (var k in attrs) { e.setAttribute(k, attrs[k]); }
  return e;
}

function dotRadius(R) {
  return Math.max(0.015 * 2 * R, 0.02 * R);
}

function keyOf(kind, i, j) {
  return kind + "_" + i + "_" + j;
}

// =============================================================================
// Rendering
// =============================================================================

function render() {
  var R = state.dome_diameter / 2.0;
  var padding = 1.12 * R;
  var size = 2 * padding;
  var viewBox = (-padding) + " " + (-padding) + " " + size + " " + size;

  var svg = el("svg", {
    viewBox: viewBox,
    preserveAspectRatio: "xMidYMid meet",
    role: "img",
    "aria-label": "Dome cone position picker"
  });

  // Ground circle
  svg.appendChild(el("circle", {
    cx: 0, cy: 0, r: R, class: "ground-circle"
  }));

  // Frame grid lines
  var ox = offsets(state.n_x, R);
  var oy = offsets(state.n_y, R);

  for (var i = 0; i < ox.length; i++) {
    var xi = ox[i];
    var chord = Math.sqrt(Math.max(0, R * R - xi * xi));
    svg.appendChild(el("line", {
      x1: xi, y1: -chord, x2: xi, y2: chord,
      class: "frame-line-a"
    }));
  }
  for (var j = 0; j < oy.length; j++) {
    var yj = oy[j];
    var chord2 = Math.sqrt(Math.max(0, R * R - yj * yj));
    svg.appendChild(el("line", {
      x1: -chord2, y1: yj, x2: chord2, y2: yj,
      class: "frame-line-b"
    }));
  }

  // Pickable positions
  var dr = dotRadius(R);
  state.positions.forEach(function (p) {
    var k = keyOf(p.kind, p.i, p.j);
    var on = state.picked[k] === true;
    var cls = "pick ";
    cls += (p.kind === "C") ? "crossing " : "midpoint ";
    cls += on ? "on" : "off";

    var node;
    if (p.kind === "C") {
      // Filled circle
      node = el("circle", {
        cx: p.x, cy: p.y, r: dr, class: cls
      });
    } else {
      // Filled diamond (rotated square)
      var s = dr * 1.3;
      node = el("rect", {
        x: p.x - s / 2,
        y: p.y - s / 2,
        width: s, height: s,
        transform: "rotate(45 " + p.x + " " + p.y + ")",
        class: cls
      });
    }

    node.addEventListener("click", function (evt) {
      evt.preventDefault();
      evt.stopPropagation();
      toggle(p.kind, p.i, p.j);
    });
    node.addEventListener("touchend", function (evt) {
      evt.preventDefault();
      evt.stopPropagation();
      toggle(p.kind, p.i, p.j);
    });
    svg.appendChild(node);
  });

  // Mount
  var container = document.getElementById("svg-container");
  container.innerHTML = "";
  container.appendChild(svg);

  // Caption
  var n = Object.keys(state.picked).length;
  document.getElementById("caption").innerHTML =
    "Picked positions: <b>" + n + "</b>";

  // Height
  setTimeout(function () {
    var wrap = document.getElementById("wrap");
    Streamlit.setFrameHeight(wrap.scrollHeight);
  }, 30);
}

// =============================================================================
// Toggle
// =============================================================================

function toggle(kind, i, j) {
  var k = keyOf(kind, i, j);
  if (state.picked[k]) {
    delete state.picked[k];
  } else {
    state.picked[k] = true;
  }
  sendValue();
  render();
}

function sendValue() {
  var out = [];
  state.positions.forEach(function (p) {
    var k = keyOf(p.kind, p.i, p.j);
    if (state.picked[k]) {
      out.push([p.kind, p.i, p.j]);
    }
  });
  Streamlit.setComponentValue({ picked: out });
}

// =============================================================================
// Render loop
// =============================================================================

Streamlit.onRender(function (args) {
  state.dome_diameter = Number(args.dome_diameter || 18.0);
  state.n_x = parseInt(args.n_x || 5, 10);
  state.n_y = parseInt(args.n_y || 5, 10);

  state.picked = {};
  var passedPicked = args.picked || [];
  passedPicked.forEach(function (item) {
    if (Array.isArray(item) && item.length === 3) {
      var kind = String(item[0]);
      if (kind === "C" || kind === "Am" || kind === "Bm") {
        state.picked[keyOf(kind, item[1], item[2])] = true;
      }
    }
  });

  buildPositions();

  // Drop any picks that are no longer valid positions.
  var validKeys = {};
  state.positions.forEach(function (p) {
    validKeys[keyOf(p.kind, p.i, p.j)] = true;
  });
  Object.keys(state.picked).forEach(function (k) {
    if (!validKeys[k]) { delete state.picked[k]; }
  });

  render();
});

Streamlit.setComponentReady();

window.addEventListener("resize", function () {
  render();
});
</script>
</body>
</html>
